<!doctype html><meta charset="utf-8"><title>BR机械臂运动学上位机</title><style>body{font-family:Arial,"Microsoft YaHei";max-width:1000px;margin:24px auto;background:#f4f6f8;color:#17202a}section{background:#fff;border:1px solid #ccd5dd;border-radius:10px;padding:18px;margin:14px 0}h1{margin-top:0}label{display:inline-flex;flex-direction:column;margin:5px 8px 5px 0}input,select{width:120px;padding:8px;border:1px solid #bbc7d1;border-radius:5px;font-size:15px}button{display:block;padding:9px 15px;background:#1670b8;color:#fff;border:0;border-radius:5px;margin-top:10px;cursor:pointer}pre{background:#101722;color:#d8f3dc;border-radius:6px;padding:14px;min-height:50px;white-space:pre-wrap}.note{color:#52606d}</style><h1>BR机械臂运动学上位机</h1><p class="note">单位：坐标 cm，角度 °。模式三内部保存上一组电机角，初始 q0~q4 全为 0°。</p><section><h2>模式一：输入绝对角度 a1~a4，计算末端坐标</h2><div id="absInputs"></div><button onclick="absoluteForward()">计算 Joint7 相对于 Joint2 坐标</button><pre id="absOut"></pre></section><section><h2>模式二：输入电机角度 q0~q4，计算末端坐标和绝对角度</h2><div id="motorInputs"></div><button onclick="motorForward()">正运动学计算</button><pre id="motorOut"></pre></section><section><h2>模式三：输入末端坐标，反解电机角度和绝对角度</h2><label>X<input id="tx" value="0"></label><label>Y<input id="ty" value="-1.506247"></label><label>Z<input id="tz" value="4.374568"></label><button onclick="inverseSolve()">计算逆解</button><button onclick="initialSolve()">计算初始坐标（q0~q4=0°）</button><pre id="inverseOut"></pre></section><script>
const L=[36.350003,5.488355,21.588995,11.631447],ZERO=[20,150,182.78,237],R=Math.PI/180;function wrap360(v){v%=360;if(v<0)v+=360;return v}function wrap180(v){v=wrap360(v);return v>180?v-360:v}function get(id){let v=Number(document.getElementById(id).value);if(!Number.isFinite(v))throw Error('请输入有效数字');return v}function fmt(a){return a.map(v=>v.toFixed(6)).join(', ')}function endpoint(a,q0){let x=0,z=0;a.forEach((v,i)=>{x+=L[i]*Math.cos(v*R);z+=L[i]*Math.sin(v*R)});return[-x*Math.sin(q0*R),-x*Math.cos(q0*R),z]}function anglesFromQ(q){return[ZERO[0]+q[1],ZERO[1]+q[1]-q[2],ZERO[2]+q[1]-q[2],ZERO[3]+q[1]-q[2]-q[3]]}function fields(container,prefix,names,values){document.getElementById(container).innerHTML=names.map((n,i)=>`<label>${n}<input id="${prefix}${i}" value="${values[i]}"></label>`).join(' ')}fields('absInputs','a',['a1','a2','a3','a4'],ZERO);fields('motorInputs','q',['q0','q1','q2','q3','q4'],[0,0,0,0,0]);function absoluteForward(){try{let a=[0,1,2,3].map(i=>get('a'+i));absOut.textContent=`q0~q4 = [0, 0, 0, 0, 0]°\na1~a4 = [${fmt(a.map(wrap360))}]°\nJoint7 - Joint2 = (${fmt(endpoint(a,0))}) cm`}catch(e){absOut.textContent=e.message}}function motorForward(){try{let q=[0,1,2,3,4].map(i=>get('q'+i)),a=anglesFromQ(q);motorOut.textContent=`q0~q4 = [${fmt(q)}]°\na1~a4 = [${fmt(a.map(wrap360))}]°\nJoint7 - Joint2 = (${fmt(endpoint(a,q[0]))}) cm`}catch(e){motorOut.textContent=e.message}}function inverseSolve(){try{let x=get('tx'),y=get('ty'),z=get('tz'),r=Math.hypot(x,y),q0=Math.atan2(-x,-y)/R,l1=L[0],l2=L[1],l3=L[2],l4=L[3],wx0=l2*Math.cos(ZERO[1]*R)+l3*Math.cos(ZERO[2]*R),wy0=l2*Math.sin(ZERO[1]*R)+l3*Math.sin(ZERO[2]*R),wl=Math.hypot(wx0,wy0),wz=Math.atan2(wy0,wx0),best=null;for(let ai=0;ai<1440;ai++){let a4=ai*0.25,wx=r-l4*Math.cos(a4*R),wy=z-l4*Math.sin(a4*R),c=(wx*wx+wy*wy-l1*l1-wl*wl)/(2*l1*wl);if(c<-1||c>1)continue;for(let s of [1,-1]){let ss=s*Math.sqrt(1-c*c),wa=Math.atan2(ss,c),aa1=Math.atan2(wy,wx)-Math.atan2(wl*ss,l1+wl*c),q1=aa1/R-ZERO[0],q2=q1-(aa1+wa-wz)/R,q3=ZERO[3]+q1-q2-a4,q=[wrap180(q0),wrap180(q1),wrap180(q2),wrap180(q3),0],a=anglesFromQ(q),cost=(q[1]/180)*(q[1]/180)+0.5/(Math.abs(q[2])/180+0.01);if(best===null||cost<best.cost)best={cost,q,a,a4}}}if(best===null)throw Error('目标坐标不可达');inverseOut.textContent=`代价函数 J = ${best.cost.toFixed(8)}\n
最优电机角度 q0~q4 = [${fmt(best.q)}]°\n最优绝对角度 a1~a4 = [${fmt(best.a.map(wrap360))}]°\n校验坐标 = (${fmt(endpoint(best.a,best.q[0]))}) cm`; }catch(e){inverseOut.textContent=e.message}}function initialSolve(){try{let q=[0,0,0,0,0],a=anglesFromQ(q),p=endpoint(a,0);inverseOut.textContent=`初始电机角度 q0~q4 = [${fmt(q)}]°\n初始绝对角度 a1~a4 = [${fmt(a.map(wrap360))}]°\n初始坐标 Joint7 - Joint2 = (${fmt(p)}) cm`}catch(e){inverseOut.textContent=e.message}}absoluteForward();motorForward();
</script>
